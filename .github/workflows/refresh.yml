name: Refresh data

on:
  schedule:
    # Settled files change once a day; the pick ledger needs several looks so a
    # late-written pick is still recorded before its match.
    - cron: "17 5,9,13,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and rebuild
        id: refresh
        continue-on-error: true
        run: python3 scripts/refresh.py
      - name: Commit when the data changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh $(date -u +%FT%H:%MZ)"
          git push
      - name: Fail when the refresh reported a problem
        if: steps.refresh.outcome == 'failure'
        run: exit 1
