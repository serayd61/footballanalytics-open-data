name: Sync open data
on:
  schedule:
    - cron: '17 4 * * *'   # daily 04:17 UTC, after the overnight settlement
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: |
          set -euo pipefail
          mkdir -p data
          for f in all premier-league championship la-liga serie-a bundesliga ligue-1 eredivisie liga-portugal champions-league brasileirao super-lig; do
            curl -fsSL --retry 3 "https://footballanalytics.pro/data/$f.csv" -o "data/$f.csv"
          done
          curl -fsSL --retry 3 "https://footballanalytics.pro/data/all.json" -o data/all.json
          head -c 400 data/all.csv; echo; wc -l data/*.csv
      - name: Commit if changed
        run: |
          git config user.name "open-data-bot"
          git config user.email "open-data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data: sync $(date -u +%F)"
          git push
